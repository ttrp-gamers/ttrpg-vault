spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PWD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  security:
      jwt-secret: ${JWT_SECRET}
      cors-allowed-origins: ${CORS_ALLOWED_ORIGIN}
  admin:
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}
    admin-email: ${ADMIN_EMAIL}



