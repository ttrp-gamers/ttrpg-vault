spring:
  application:
    name: manager
  profiles:
    active: ${SPRING_ACTIVE_PROFILE:dev}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
app:
  security:
    jwt-access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    jwt-refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:9000000}
  storage:
    location: ${APP_STORAGE_LOCATION:./storage}